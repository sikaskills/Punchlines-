<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A2E1D">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Punchlines</title>
<style>
:root{--b:#4A2E1D;--g:#B8863B;--c:#FAF3E6;--t:#2B2B2B;--l:#E8D9B8}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Georgia,serif;color:var(--t);background:#fff;padding-bottom:70px}
header{background:var(--b);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
header b{color:var(--g);letter-spacing:.08em;font-size:12px;display:block}header h1{margin:0;font-size:18px}
main{padding:14px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--b);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;font-size:12px;background:none;border:0;color:#d9c7a3;padding:14px 0;font:inherit;font-size:13px}.tabs .on{color:#fff;border-top:3px solid var(--g)}
label{display:block;font-size:12px;color:#5a5a5a;margin:12px 0 3px}input,textarea{width:100%;border:1px solid var(--l);border-radius:8px;padding:10px;font:inherit;background:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{white-space:nowrap;border:1px solid var(--g);background:#fff;color:var(--b);border-radius:18px;padding:6px 12px;font:inherit;font-size:13px}
.chips .on{background:var(--b);color:#fff;border-color:var(--b)}
.it{border:1px solid var(--l);border-left:4px solid var(--g);border-radius:8px;padding:11px;margin:9px 0;background:var(--c);white-space:pre-wrap}
.it small{color:var(--g);display:block;font-weight:bold;margin-bottom:3px}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sh.o{display:flex}
#sh div{background:#fff;width:100%;padding:14px;border-radius:16px 16px 0 0;max-height:92%;overflow:auto}
#sh textarea{height:230px}.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:30%;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:bold;background:var(--g);color:#fff}.btn.d{background:var(--b)}.btn.w{background:#fff;color:var(--b);border:1px solid var(--b)}
.warn{color:#b3261e;font-size:13px;margin-top:6px}.hint{font-size:13px;color:#5a5a5a}
</style></head><body>
<header><b>SIKA SKILLS</b><h1 id="ti">Punchlines</h1></header>
<main id="m"></main>
<nav class="tabs"><button data-t="f">Ma fiche</button><button data-t="b">Banque</button><button data-t="p">Plan</button><button data-t="c">Vérifier</button><button data-t="s">Favoris</button></nav>
<div id="sh"><div>
<textarea id="ta"></textarea><div class="warn" id="wn"></div>
<div class="row"><button class="btn d" id="cp">Copier</button><button class="btn" id="wa">WhatsApp</button><button class="btn w" id="sv">★ Garder</button></div>
<div class="row"><button class="btn w" id="sr">Partager…</button><button class="btn w" id="cl">Fermer</button></div></div></div>
<script>
const FL=[['nom','Nom du produit','Baskets Urban Pro'],['pb','Problème du client','Des baskets qui font mal aux pieds'],['comp','Compétence / ce que je sais faire','vendre des baskets confortables'],['res','Résultat promis','marcher sans mal toute la journée'],['diff','Ce qui me rend différent(e)','semelle souple'],['app','Ce que le produit apporte','confort et solidité'],['dur','Durée / délai','livraison en 48 h'],['prix','Prix (avec FCFA)','15 000 FCFA'],['date','Date limite','dimanche soir'],['nb','Nombre de places','20'],['bonus','Bonus offert','une paire de chaussettes'],['bonus2','Bonus supplémentaire',''],['pre','Prénom du témoin','Awa'],['ville','Ville du témoin','Cotonou'],['cit','Témoignage réel (citation)','']];
const MAP={'nom du produit':'nom','problème':'pb','problème du client':'pb','compétence':'comp','ta compétence':'comp','résultat':'res','ta différence':'diff','ce que le produit apporte':'app','durée':'dur','prix':'prix','date':'date','nombre':'nb','bonus':'bonus','bonus supplémentaire':'bonus2','prénom':'pre','ville':'ville'};
const D={
Problème:["Tu as un talent que personne ne connaît encore ?","Tu en as marre de [problème] sans savoir comment t’en sortir ?","Et si le vrai frein n’était pas ton talent, mais le fait de ne pas savoir le vendre ?","Tu perds du temps et de l’argent à essayer seul(e) ?","Combien de fois as-tu remis ton projet à demain par peur de te tromper ?","[Problème du client] te bloque depuis trop longtemps.","Tu sais faire [compétence], mais tu ne sais pas comment en vivre ?","Ce n’est pas le manque de talent qui te freine, c’est le manque de méthode.","Tu regardes les autres réussir et tu te demandes : pourquoi pas moi ?","Stop à l’improvisation : voici la méthode qui change tout."],
Résultat:["Transforme ton savoir en revenus dès ce mois-ci.","Et si tu recevais ton premier virement dans les prochains jours ?","Apprends à vendre [compétence] sans expérience, sans grosse audience.","La méthode simple pour transformer ce que tu sais déjà en argent.","Lance ton activité en ligne, même en partant de zéro.","De débutant(e) à premier client payant, étape par étape.","Ce que tu sais faire aujourd’hui peut te rapporter dès demain.","Construis un revenu à partir de tes connaissances, sans matériel compliqué.","La liberté financière commence par une seule décision.","Deviens indépendant(e) grâce à ce que tu sais déjà faire."],
Urgence:["Offre de lancement valable jusqu’au [date] seulement.","Places limitées : plus que [nombre] disponibles.","Ce tarif ne sera plus proposé après le [date].","Les [nombre] premiers inscrits reçoivent [bonus] en plus.","Dernières heures pour profiter du prix de lancement.","Une fois ce nombre de places atteint, l’offre disparaît.","Ne remets pas à demain ce qui peut changer ta situation aujourd’hui.","Cette opportunité ne se représentera pas à ce prix.","Rejoins-nous avant que les places soient toutes prises.","Le compte à rebours a commencé."],
Preuve:["Rejoins les [nombre] personnes qui ont déjà commencé.","Elles étaient dans la même situation que toi il y a quelques semaines.","« [Citation] » — [Prénom], [ville]","De plus en plus de personnes transforment leur savoir en revenus. À ton tour.","Découvre pourquoi tant de personnes recommandent cette méthode.","[Nombre] guides déjà téléchargés cette semaine.","Elles ont commencé sans expérience. Aujourd’hui, elles ont leurs premiers clients.","Une méthode déjà testée et approuvée par [nombre] débutant(e)s.","Ce n’est pas de la théorie : voici ce que d’autres ont obtenu.","Ne nous crois pas sur parole : écoute la leur."],
Objections:["« Je n’ai pas le temps » ? [Nom du produit] se lit en [durée], sans y passer des heures.","« C’est trop cher » ? Ça coûte [prix], soit moins que ce que tu perds en tâtonnant.","« Je n’ai pas d’expérience » ? Justement : c’est fait pour les débutant(e)s.","« Je n’ai pas d’audience » ? Tu n’as pas besoin de milliers d’abonnés pour faire ta première vente.","« Je ne suis pas assez doué(e) » ? Il suffit d’avoir un pas d’avance sur la personne que tu aides.","« Ça ne marchera pas pour moi » ? C’est ce que beaucoup pensent avant de commencer. Voici ce qui change avec une méthode.","« J’ai déjà essayé, sans résultat » ? Il te manquait peut-être [ce que le produit apporte].","« Je ne sais pas par où commencer » ? Voici l’ordre exact, étape par étape.","« Il y a déjà trop de monde sur ce sujet » ? Personne ne l’explique comme toi : [ta différence].","« Je vais y réfléchir » ? Réfléchis, oui. Mais ne laisse pas passer [date] ou [bonus]."],
Textes:[
["Tu as un talent que personne ne connaît encore ?","Beaucoup de personnes savent faire quelque chose d’utile, mais ne savent pas comment le transformer en revenu. [Nom du produit] t’accompagne pas à pas, même sans expérience ni grosse audience.","Découvre comment démarrer →"],
["Et si tu recevais ton premier virement dans les prochains jours ?","[Nom du produit] t’apprend, étape par étape, à vendre tes connaissances en ligne et à générer tes premiers revenus, simplement, depuis chez toi.","Commence maintenant →"],
["Offre de lancement valable jusqu’au [date] seulement.","Profite du tarif de lancement de [Nom du produit] avant qu’il ne remonte définitivement. Les [nombre] premiers inscrits reçoivent en plus [bonus].","Je réserve ma place →"],
["Rejoins les [nombre] personnes qui ont déjà commencé.","Elles étaient exactement dans ta situation il y a quelques semaines. Aujourd’hui, elles avancent grâce à [Nom du produit]. « [Citation] » — [Prénom].","Rejoins-les maintenant →"],
["Ce n’est pas ton talent qui manque, c’est la méthode.","Tu sais faire [compétence], mais tu ne sais pas par où commencer pour en vivre ? [Nom du produit] t’explique exactement quoi faire, dans l’ordre, sans jargon.","Découvre la méthode →"],
["La liberté financière commence par une seule décision.","Avec [Nom du produit], apprends à transformer ce que tu sais déjà faire en revenu réel, à ton rythme, depuis chez toi.","Je me lance →"],
["Les [nombre] premiers inscrits reçoivent [bonus] offert.","[Nom du produit] inclut déjà des bonus pour t’aider à démarrer. Pour le lancement, les premiers inscrits reçoivent en plus [bonus supplémentaire] — pendant quelques jours seulement.","J’en profite maintenant →"],
["« [Citation] »","C’est le retour de [Prénom], qui a suivi [Nom du produit]. Comme lui/elle, tu peux avancer étape par étape.","Lis son témoignage complet →"],
["« C’est trop cher » ? Regarde ce que ça t’évite.","[Nom du produit] te fait gagner des semaines d’essais-erreurs et de doutes. Le prix d’un bon départ est toujours plus rentable que celui de repartir de zéro.","Découvre le contenu complet →"],
["Tu hésites encore ?","Tu peux continuer à attendre le bon moment, ou décider aujourd’hui de commencer. [Nom du produit] t’accompagne dès la première étape.","Je commence aujourd’hui →"],
["« Je n’ai pas le temps » ? Il te suffit de [durée].","[Nom du produit] s’adapte à ton emploi du temps : [durée] suffisent pour [résultat].","Je commence à mon rythme →"],
["« Je n’ai pas d’expérience » ? Parfait, c’est pour toi.","[Nom du produit] est pensé pour les débutant(e)s : tu avances étape par étape, sans jargon, avec des exemples concrets.","Je démarre →"],
["« Je n’ai pas d’audience » ? Ta première vente peut venir de tes contacts.","Pas besoin de milliers d’abonnés. Tes contacts WhatsApp, tes groupes Facebook et quelques publications bien écrites peuvent suffire pour [Nom du produit].","Je passe à l’action →"],
["« Ça ne marchera pas pour moi » ? Voyons pourquoi tu le penses.","Beaucoup pensent la même chose avant de commencer. [Nom du produit] te donne une méthode claire. « [Citation] » — [Prénom].","Découvre la méthode →"],
["« J’ai déjà essayé, sans résultat » ? Le problème n’était peut-être pas toi.","Sans méthode, même un bon projet avance au hasard. [Nom du produit] t’apporte [ce que le produit apporte].","Je réessaie avec une méthode →"],
["« Je vais y réfléchir » ? Bonne idée, mais pas trop longtemps.","L’offre de [Nom du produit] se termine le [date]. Prends le temps de décider : passé cette date, le prix de lancement ne sera plus disponible.","Je regarde le contenu →"]].map(a=>a.join('\n\n')),
Courts:["Tu sais faire quelque chose d’utile.\nIl te manque juste la méthode pour en vivre.\n[Nom du produit] — dispo maintenant.\n→ Écris-moi en message privé","Ton premier virement peut arriver plus vite que tu ne le penses.\n→ Découvre comment, écris-moi.","« Je n’ai pas le temps » ? [durée] suffisent.\n→ Réponds à ce statut.","Plus que [nombre] places à [prix].\n[bonus] offert aux premiers.\n→ Réponds à ce statut pour réserver la tienne."]};
const $=s=>document.querySelector(s),ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const PL=[['Faire reconnaître le problème','Problème','Statut WhatsApp (accroche courte) + 1 post Facebook'],['Montrer le résultat possible','Résultat','Post Facebook (texte complet) + statut WhatsApp'],['Annoncer le produit et son prix','Textes','Annonce Facebook, statuts WhatsApp, vidéo TikTok'],['Rassurer','Preuve','Témoignage réel ou photo de client, en statut et en post'],['Lever les doutes','Objections','Une objection par publication (temps, prix, expérience)'],['Créer l’urgence','Urgence','Rappel de la date limite et des places restantes, matin et soir'],['Conclure','Urgence','« Dernières heures » + relance en message privé de ceux qui ont hésité']];
const CK=['Mon accroche parle d’un blocage ou d’un résultat, pas de moi.','Il ne reste aucun [crochet] dans mon texte.','Mes prix, dates et nombres de places sont vrais, en FCFA.','Mon témoignage est réel, et la personne est d’accord.','Il y a un seul appel à l’action, clair.','Le client sait comment commander (WhatsApp, message privé).','Je me suis relu(e) à voix haute.','Le format convient à la plateforme (court pour statut et TikTok, complet pour Facebook).'];
let tab='f',cat='Problème',V=ls('fiche',{}),FV=ls('favs',[]),PS=ls('plan',{}),CS=ls('ck',{});
const fill=t=>t.replace(/\[([^\]]+)\]/g,(m,k)=>{k=k.toLowerCase().replace(/…$/,'');const id=/^citation/.test(k)?'cit':MAP[k];return id&&V[id]?V[id]:m});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const m=$('#m');
if(tab=='f'){$('#ti').textContent='Ma fiche produit';m.innerHTML='<p class="hint">Remplis-la une fois : les [crochets] de tous les textes se complètent tout seuls. Enregistré automatiquement sur ce téléphone.</p>'+FL.map(f=>`<label>${f[1]}</label><input data-k="${f[0]}" placeholder="ex. ${f[2]}" value="${esc(V[f[0]]||'')}">`).join('');
m.querySelectorAll('input').forEach(i=>i.oninput=()=>{V[i.dataset.k]=i.value;sv('fiche',V)})}
else if(tab=='b'){$('#ti').textContent='Banque à punchlines';m.innerHTML='<div class="chips">'+Object.keys(D).map(c=>`<button class="${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('')+'</div>'+D[cat].map((t,i)=>`<div class="it" data-i="${i}"><small>${cat} ${i+1}</small>${esc(fill(t))}</div>`).join('');
m.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();scrollTo(0,0)});m.querySelectorAll('.it').forEach(e=>e.onclick=()=>open(fill(D[cat][+e.dataset.i])))}
else if(tab=='p'){$('#ti').textContent='Plan sur 7 jours';m.innerHTML='<p class="hint">Un jour, un objectif, une catégorie. Prépare tes textes la veille.</p>'+PL.map((p,i)=>`<div class="it"><label style="display:flex;gap:10px;margin:0;color:inherit;font-size:15px"><input type="checkbox" data-j="${i}" ${PS[i]?'checked':''} style="width:20px;padding:0"><b>Jour ${i+1} — ${p[0]}</b></label><div class="hint" style="margin:4px 0 8px 30px">${p[2]}</div><button class="btn w" data-g="${p[1]}" style="margin-left:30px;padding:8px;flex:none">Voir : ${p[1]} →</button></div>`).join('');
m.querySelectorAll('input').forEach(c=>c.onchange=()=>{PS[c.dataset.j]=c.checked;sv('plan',PS)});m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{cat=b.dataset.g;tab='b';render();scrollTo(0,0)})}
else if(tab=='c'){$('#ti').textContent='Avant de publier';m.innerHTML='<p class="hint">Coche chaque ligne avant d’appuyer sur « publier ».</p>'+CK.map((t,i)=>`<div class="it"><label style="display:flex;gap:10px;margin:0;color:inherit;font-size:15px"><input type="checkbox" data-k="${i}" ${CS[i]?'checked':''} style="width:20px;padding:0"><span>${t}</span></label></div>`).join('')+'<div class="row"><button class="btn d" id="rz">Tout décocher</button></div><p class="hint"><b>Test A/B :</b> publie deux accroches différentes sur deux jours, compte les réponses reçues, garde celle qui fait le plus réagir.</p>';
m.querySelectorAll('input').forEach(c=>c.onchange=()=>{CS[c.dataset.k]=c.checked;sv('ck',CS)});$('#rz').onclick=()=>{CS={};sv('ck',CS);render()}}
else{$('#ti').textContent='Mes favoris';m.innerHTML=FV.length?FV.map((t,i)=>`<div class="it" data-i="${i}">${esc(t)}</div>`).join(''):'<p class="hint">Rien ici pour l’instant. Ouvre un texte dans la Banque, modifie-le, puis touche « ★ Garder ».</p>';
m.querySelectorAll('.it').forEach(e=>e.onclick=()=>open(FV[+e.dataset.i],+e.dataset.i))}}
let cur=-1;function chk(){const n=($('#ta').value.match(/\[[^\]]+\]/g)||[]).length;$('#wn').textContent=n?`Il reste ${n} crochet(s) à remplacer avant de publier.`:''}
function open(t,i=-1){cur=i;$('#ta').value=t;chk();$('#sh').classList.add('o')}
$('#ta').oninput=chk;$('#cl').onclick=()=>$('#sh').classList.remove('o');
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#ta').value)}catch(e){$('#ta').select();document.execCommand('copy')}$('#cp').textContent='Copié ✓';setTimeout(()=>$('#cp').textContent='Copier',1500)};
$('#wa').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent($('#ta').value);
$('#sr').onclick=()=>navigator.share?navigator.share({text:$('#ta').value}).catch(()=>{}):$('#cp').click();
$('#sv').onclick=()=>{const t=$('#ta').value;if(cur>=0)FV[cur]=t;else FV.unshift(t);sv('favs',FV);$('#sv').textContent='Gardé ✓';setTimeout(()=>$('#sv').textContent='★ Garder',1500)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
